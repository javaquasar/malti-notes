name: Build Pages With WASM

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        id: node_deps
        run: npm ci

      - name: Install Playwright browser
        id: playwright_browser
        run: npx playwright install --with-deps chromium

      - name: Validate CI quality contract
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run ci:workflow:check

      - name: Lint shared styles
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run style:lint

      - name: Validate data structure
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run data:lint

      - name: Validate generated JSON schemas
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run schema:check

      - name: Validate learning content
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run content:lint

      - name: Check B1 and B2 book coverage
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run books:coverage

      - name: Validate book course bindings
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run course:lint

      - name: Validate links and data bindings
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run links:lint

      - name: Validate generated offline shell
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run pwa:check

      - name: Validate full-content search index
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run search:check

      - name: Check theme accessibility
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run theme:a11y

      - name: Run browser accessibility checks
        if: ${{ always() && steps.playwright_browser.outcome == 'success' }}
        env:
          PLAYWRIGHT_USE_BUNDLED: "1"
        run: npm run a11y:check

      - name: Run visual smoke checks
        if: ${{ always() && steps.node_deps.outcome == 'success' }}
        run: npm run visual:smoke

      - name: Run functional Playwright checks
        if: ${{ always() && steps.playwright_browser.outcome == 'success' }}
        run: npm run functional:test

      - name: Compare framed content group baseline
        if: ${{ always() && steps.playwright_browser.outcome == 'success' }}
        run: npm run visual:groups

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framed-content-artifacts
          path: |
            visual-regression/screenshots/
            visual-regression/diffs/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture and validate visual shard
        env:
          PLAYWRIGHT_USE_BUNDLED: "1"
          VISUAL_SHARD_INDEX: ${{ matrix.shard }}
          VISUAL_SHARD_TOTAL: 3
        run: npm run visual:ci

      - name: Upload visual shard artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-shard-${{ matrix.shard }}
          path: visual-regression/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, visual]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache wasm-pack
        id: wasm_pack_cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-v1

      - name: Install wasm-pack
        if: steps.wasm_pack_cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked

      - name: Build Rust WASM bundle
        run: wasm-pack build wasm-search --target web --out-dir ../assets/wasm --out-name malti_notes_wasm

      - name: Generate full-content search index
        run: npm run search:build

      - name: Generate revisioned offline shell
        run: npm run pwa:build

      - name: Prepare static site folder
        run: |
          mkdir -p site-dist
          cp *.html site-dist/
          cp manifest.webmanifest service-worker.js site-dist/
          cp -R assets site-dist/
          rm -f site-dist/assets/data/course_target_assessments.json
          rm -f site-dist/assets/data/course_target_bindings.json
          rm -f site-dist/assets/data/course_target_examples.json
          rm -f site-dist/assets/data/course_target_glosses.json
          rm -f site-dist/assets/data/course_source_provenance.json
          rm -f site-dist/assets/data/course_supplemental_content.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
