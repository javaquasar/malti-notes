name: Build Pages With WASM

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: |
          npm run style:lint
          npm run data:lint
          npm run links:lint
          npm run theme:a11y
          npm run functional:test
          npm run visual:smoke
          npm run visual:ci

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            visual-regression/screenshots/
            visual-regression/diffs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build Rust WASM bundle
        run: wasm-pack build wasm-search --target web --out-dir ../assets/wasm --out-name malti_notes_wasm

      - name: Prepare static site folder
        run: |
          mkdir -p site-dist
          cp *.html site-dist/
          cp manifest.webmanifest service-worker.js site-dist/
          cp -R assets site-dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
